<!--
  Fragment injected into #wv-root by MainActivity.
  No html/head/body tags here: this becomes innerHTML of a single div inside the
  live web.whatsapp.com page. Every selector in custom-ui.css is prefixed with #wv-root.
-->
<div class="wa-shell">
  <header class="wa-header">
    <button class="wa-icon-btn" id="btn-back" type="button" aria-label="Back to chats" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="wa-heading">
      <span class="wa-title" id="header-title">WhatsApp</span>
      <span class="wa-subtitle" id="header-subtitle" hidden></span>
    </div>
    <button class="wa-icon-btn" id="btn-refresh" type="button" aria-label="Refresh chats">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </header>

  <main class="wa-main">
    <section class="wa-pane" id="list-pane">
      <div class="wa-search">
        <svg class="wa-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search-input" type="text" placeholder="Search chats" autocomplete="off" spellcheck="false">
      </div>
      <div id="chat-list" class="wa-chat-list">
        <div class="wa-empty">Loading chats…</div>
      </div>
    </section>

    <section class="wa-pane" id="chat-pane" hidden>
      <div id="messages" class="wa-messages"></div>
      <div class="wa-composer">
        <input id="msg-input" type="text" placeholder="Type a message" autocomplete="off" spellcheck="false">
        <button id="btn-send" class="wa-send" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39 1.18L4 11a1 1 0 0 0 .73.68L13 14l-8.27 2.32A1 1 0 0 0 4 17l-.61 2.59A.4.4 0 0 0 3.78 20a1 1 0 0 0-.38-.6z"/></svg>
        </button>
      </div>
    </section>
  </main>

  <div class="wa-toast" id="wa-toast" hidden></div>
</div>

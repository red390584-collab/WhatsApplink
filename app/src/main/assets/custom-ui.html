<!--
  Fragment injected into #wv-root by MainActivity (innerHTML of a single div inside the
  live web.whatsapp.com page). No html/head/body tags here. Every selector in
  custom-ui.css is scoped under #wv-root so nothing leaks into the official stylesheet.
-->
<div class="wa-shell">

  <!-- ================= top bar (shared by list / chat / new-chat) ================= -->
  <header class="wa-topbar">
    <button class="wa-ic" id="btn-back" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>

    <div class="wa-hdr-avatar" id="hdr-avatar" hidden>
      <span class="wa-hdr-avatar-initial" id="hdr-avatar-initial"></span>
      <img id="hdr-avatar-img" alt="" hidden>
    </div>

    <div class="wa-hdr-text">
      <div class="wa-hdr-title" id="hdr-title">WhatsApp</div>
      <div class="wa-hdr-sub" id="hdr-sub" hidden></div>
    </div>

    <button class="wa-ic" id="btn-search" type="button" aria-label="Search chats">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
    <button class="wa-ic" id="btn-refresh" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </header>

  <!-- ================= search field (folds out of the list header) ================= -->
  <div class="wa-searchwrap" id="searchwrap" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="search-input" type="text" placeholder="Search or start a new chat" autocomplete="off" spellcheck="false">
    <button class="wa-ic-sm" id="btn-search-close" type="button" aria-label="Close search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <main class="wa-main">

    <!-- ================= chat list ================= -->
    <section class="wa-pane" id="list-pane">
      <div class="wa-list" id="chat-list">
        <div class="wa-empty">
          <div class="wa-empty-art">
            <svg viewBox="0 0 120 120" width="104" height="104" aria-hidden="true">
              <circle cx="60" cy="60" r="52" fill="#e7ffdb"/>
              <path fill="#25d366" d="M60 26c-15.5 0-28 11.6-28 26 0 5.1 1.6 9.8 4.4 13.8L33 82l17-4.4A29.6 29.6 0 0 0 60 78c15.5 0 28-11.6 28-26S75.5 26 60 26z"/>
              <circle cx="48" cy="53" r="3.4" fill="#ffffff"/>
              <circle cx="60" cy="53" r="3.4" fill="#ffffff"/>
              <circle cx="72" cy="53" r="3.4" fill="#ffffff"/>
            </svg>
          </div>
          <div class="wa-empty-title" id="empty-title">Loading chats…</div>
          <div class="wa-empty-text" id="empty-text">Syncing with your linked WhatsApp account.</div>
        </div>
      </div>

      <button class="wa-fab" id="btn-new-chat" type="button" aria-label="Start a new chat">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.91-7.01zM12.05 20.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.19-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.26.86 5.81 2.42a8.16 8.16 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.39.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></svg>
      </button>
    </section>

    <!-- ================= conversation ================= -->
    <section class="wa-pane" id="chat-pane" hidden>
      <div class="wa-doodle" aria-hidden="true">
        <svg width="100%" height="100%">
          <defs>
            <pattern id="wvDoodle" width="220" height="220" patternUnits="userSpaceOnUse">
              <g fill="none" stroke="#0b141a" stroke-opacity="0.055" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M24 34c0-9 13-11 15-2 2-9 15-7 15 2 0 10-15 17-15 17S24 44 24 34z"/>
                <path d="M96 26q9-11 18 0t18 0 18 0"/>
                <circle cx="178" cy="30" r="11"/>
                <path d="M188 96l6 12 14 2-10 10 2 14-12-6-12 6 2-14-10-10 14-2z"/>
                <path d="M34 104q14-18 28 0t28 0 28 0"/>
                <circle cx="150" cy="140" r="9"/>
                <path d="M196 118v26a10 10 0 0 1-10 10h-14"/>
                <path d="M28 176h28v10a12 12 0 0 1-12 12h-4a12 12 0 0 1-12-12z"/>
                <path d="M56 180h7a6 6 0 0 1 0 12h-7"/>
                <path d="M112 196l44-15-15 44-9-20z"/>
                <circle cx="86" cy="60" r="7"/>
                <path d="M172 190q10-8 20 0t20 0"/>
              </g>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#wvDoodle)"/>
        </svg>
      </div>

      <div class="wa-thread" id="messages"></div>

      <button class="wa-scroll-down" id="btn-scroll-down" type="button" aria-label="Scroll to latest" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" transform="rotate(90 12 12)"/></svg>
      </button>

      <div class="wa-composer">
        <div class="wa-inputbox">
          <input id="msg-input" type="text" placeholder="Message" autocomplete="off" spellcheck="false" enterkeyhint="send">
        </div>
        <button class="wa-send" id="btn-send" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </section>

    <!-- ================= new chat (contact picker) ================= -->
    <section class="wa-pane" id="contacts-pane" hidden>
      <div class="wa-list" id="contact-list">
        <div class="wa-empty">Loading contacts…</div>
      </div>
    </section>

  </main>

  <!-- ================= long-press / action sheet ================= -->
  <div class="wa-scrim" id="sheet-scrim" hidden></div>
  <div class="wa-sheet" id="sheet" hidden>
    <div class="wa-sheet-preview" id="sheet-preview"></div>
    <button class="wa-sheet-btn" id="sheet-copy" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
      Copy text
    </button>
    <button class="wa-sheet-btn" id="sheet-cancel" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      Cancel
    </button>
  </div>

  <div class="wa-toast" id="wa-toast" hidden></div>
</div>
